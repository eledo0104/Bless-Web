<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#462F1E" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="hempBraids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2A888"/>
      <stop offset="50%" stop-color="#A68765"/>
      <stop offset="100%" stop-color="#7A5E3F"/>
    </linearGradient>
    <radialGradient id="teakBead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8F5933"/>
      <stop offset="70%" stop-color="#5C3418"/>
      <stop offset="100%" stop-color="#3A1F0D"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Braided Cord Bracelet Arc -->
  <g filter="url(#shadow)" transform="translate(300, 280)">
    <!-- Braided elliptical curve -->
    <path d="M -160 0 C -160 160, 160 160, 160 0 C 160 -110, -160 -110, -160 0" 
          fill="none" stroke="url(#hempBraids)" stroke-width="16" stroke-dasharray="16 6"/>

    <!-- Central Teak Wood Beads -->
    <circle cx="-50" cy="98" r="14" fill="url(#teakBead)"/>
    <circle cx="0" cy="112" r="18" fill="url(#teakBead)"/>
    <circle cx="50" cy="98" r="14" fill="url(#teakBead)"/>

    <!-- Brass spacer beads -->
    <circle cx="-25" cy="107" r="7" fill="#D4AF37"/>
    <circle cx="25" cy="107" r="7" fill="#D4AF37"/>

    <!-- Adjustable sliding knot tails -->
    <path d="M -150 -60 C -190 -90, -210 -130, -220 -160" fill="none" stroke="#8C6E4E" stroke-width="6" stroke-linecap="round"/>
    <path d="M 150 -60 C 190 -90, 210 -130, 220 -160" fill="none" stroke="#8C6E4E" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-220" cy="-160" r="9" fill="url(#teakBead)"/>
    <circle cx="220" cy="-160" r="9" fill="url(#teakBead)"/>
  </g>

  <g transform="translate(40, 520)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#8C6E4E"/>
    <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#554436" letter-spacing="1">BRAIDED HEMP FIBER</text>
  </g>
</svg>
