<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#554422" flood-opacity="0.22"/>
    </filter>
    <radialGradient id="brassGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="85%" stop-color="#997A15"/>
      <stop offset="100%" stop-color="#664D00"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Left Earring -->
    <g transform="translate(210, 150)">
      <!-- Ear wire -->
      <path d="M 0 0 C 0 -30, 25 -30, 25 0 C 25 20, 0 25, 0 45" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="45" r="5" fill="#D4AF37"/>
      <!-- Hammered disc -->
      <circle cx="0" cy="140" r="75" fill="url(#brassGrad)"/>
      <!-- Hammered texture divots -->
      <circle cx="-30" cy="115" r="8" fill="#B38F1F" opacity="0.4"/>
      <circle cx="20" cy="120" r="9" fill="#B38F1F" opacity="0.4"/>
      <circle cx="-10" cy="155" r="10" fill="#B38F1F" opacity="0.4"/>
      <circle cx="35" cy="160" r="7" fill="#B38F1F" opacity="0.4"/>
      <circle cx="-35" cy="170" r="8" fill="#B38F1F" opacity="0.4"/>
      <circle cx="0" cy="130" r="7" fill="#B38F1F" opacity="0.4"/>
      <circle cx="10" cy="180" r="8" fill="#B38F1F" opacity="0.4"/>
    </g>

    <!-- Right Earring -->
    <g transform="translate(390, 150)">
      <path d="M 0 0 C 0 -30, 25 -30, 25 0 C 25 20, 0 25, 0 45" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="45" r="5" fill="#D4AF37"/>
      <circle cx="0" cy="140" r="75" fill="url(#brassGrad)"/>
      <circle cx="-30" cy="115" r="8" fill="#B38F1F" opacity="0.4"/>
      <circle cx="20" cy="120" r="9" fill="#B38F1F" opacity="0.4"/>
      <circle cx="-10" cy="155" r="10" fill="#B38F1F" opacity="0.4"/>
      <circle cx="35" cy="160" r="7" fill="#B38F1F" opacity="0.4"/>
      <circle cx="-35" cy="170" r="8" fill="#B38F1F" opacity="0.4"/>
      <circle cx="0" cy="130" r="7" fill="#B38F1F" opacity="0.4"/>
      <circle cx="10" cy="180" r="8" fill="#B38F1F" opacity="0.4"/>
    </g>
  </g>

  <g transform="translate(40, 520)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#D4AF37"/>
    <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#554436" letter-spacing="1">HAMMERED BRASS</text>
  </g>
</svg>
