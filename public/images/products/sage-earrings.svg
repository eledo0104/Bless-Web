<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F7FAF8"/>
      <stop offset="100%" stop-color="#E2EBE5"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2D4034" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="sageLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CB3A1"/>
      <stop offset="50%" stop-color="#7B9982"/>
      <stop offset="100%" stop-color="#55755E"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Pair of macrame leaf earrings -->
  <g filter="url(#shadow)">
    <!-- Left Earring -->
    <g transform="translate(210, 100)">
      <!-- Hook -->
      <path d="M 0 0 C 0 -25, 20 -25, 20 0 C 20 15, 0 20, 0 35" fill="none" stroke="#CCA769" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="35" r="4" fill="#CCA769"/>
      
      <!-- Leaf Macrame body -->
      <path d="M 0 45 C 50 110, 60 210, 0 310 C -60 210, -50 110, 0 45 Z" fill="url(#sageLeaf)"/>
      <!-- Macrame cord texture lines -->
      <line x1="0" y1="45" x2="0" y2="310" stroke="#445D4B" stroke-width="3"/>
      <line x1="0" y1="90" x2="35" y2="130" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="90" x2="-35" y2="130" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="140" x2="48" y2="185" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="140" x2="-48" y2="185" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="190" x2="46" y2="235" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="190" x2="-46" y2="235" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="240" x2="30" y2="280" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="240" x2="-30" y2="280" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Right Earring -->
    <g transform="translate(390, 100)">
      <!-- Hook -->
      <path d="M 0 0 C 0 -25, 20 -25, 20 0 C 20 15, 0 20, 0 35" fill="none" stroke="#CCA769" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="0" cy="35" r="4" fill="#CCA769"/>
      
      <!-- Leaf Macrame body -->
      <path d="M 0 45 C 50 110, 60 210, 0 310 C -60 210, -50 110, 0 45 Z" fill="url(#sageLeaf)"/>
      <!-- Macrame cord texture lines -->
      <line x1="0" y1="45" x2="0" y2="310" stroke="#445D4B" stroke-width="3"/>
      <line x1="0" y1="90" x2="35" y2="130" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="90" x2="-35" y2="130" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="140" x2="48" y2="185" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="140" x2="-48" y2="185" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="190" x2="46" y2="235" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="190" x2="-46" y2="235" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="240" x2="30" y2="280" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="240" x2="-30" y2="280" stroke="#445D4B" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <g transform="translate(40, 520)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#678A70"/>
    <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#2E4435" letter-spacing="1">MACRAME COTTON</text>
  </g>
</svg>
