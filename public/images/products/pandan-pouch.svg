<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3A3828" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="pandanWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2BC9A"/>
      <stop offset="50%" stop-color="#A6A07A"/>
      <stop offset="100%" stop-color="#7B7652"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(160, 190)">
    <!-- Pouch Body -->
    <rect x="0" y="30" width="280" height="190" rx="20" fill="url(#pandanWeave)"/>

    <!-- Diagonal Chevron / Herringbone Weave Pattern -->
    <g stroke="#615D3E" stroke-width="2" opacity="0.4">
      <line x1="0" y1="50" x2="280" y2="50"/>
      <line x1="0" y1="80" x2="280" y2="80"/>
      <line x1="0" y1="110" x2="280" y2="110"/>
      <line x1="0" y1="140" x2="280" y2="140"/>
      <line x1="0" y1="170" x2="280" y2="170"/>
      <line x1="0" y1="200" x2="280" y2="200"/>

      <line x1="30" y1="30" x2="80" y2="220"/>
      <line x1="70" y1="30" x2="120" y2="220"/>
      <line x1="110" y1="30" x2="160" y2="220"/>
      <line x1="150" y1="30" x2="200" y2="220"/>
      <line x1="190" y1="30" x2="240" y2="220"/>
    </g>

    <!-- Brass Zipper on top -->
    <rect x="10" y="22" width="260" height="12" rx="4" fill="#D4AF37"/>
    <circle cx="25" cy="28" r="6" fill="#80562D"/>
    <!-- Zipper pull tag -->
    <path d="M 25 34 L 20 65 L 30 65 Z" fill="#80562D"/>
  </g>

  <g transform="translate(40, 520)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#8E8863"/>
    <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#4B4833" letter-spacing="1">WOVEN PANDAN LEAF</text>
  </g>
</svg>
