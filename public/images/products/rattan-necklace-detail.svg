<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#E5DCcf"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#5A3E2B" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="rattanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0B68C"/>
      <stop offset="50%" stop-color="#C08B5C"/>
      <stop offset="100%" stop-color="#8F5D38"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Macro Close-up View of the Woven Knot -->
  <g filter="url(#shadow)" transform="translate(300, 300)">
    <!-- Outer concentric spirals representing rattan weave texture -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#rattanGrad)" stroke-width="28" stroke-dasharray="24 12"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="#A77248" stroke-width="20" stroke-dasharray="16 10"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#rattanGrad)" stroke-width="22" stroke-dasharray="14 8"/>
    <circle cx="0" cy="0" r="55" fill="#EADBC8" stroke="#7A4D2E" stroke-width="12"/>
    <circle cx="0" cy="0" r="22" fill="#554436"/>

    <!-- Weave crosses -->
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#7A4D2E" stroke-width="6" opacity="0.4"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#7A4D2E" stroke-width="6" opacity="0.4"/>
    <line x1="-127" y1="-127" x2="127" y2="127" stroke="#7A4D2E" stroke-width="6" opacity="0.4"/>
    <line x1="127" y1="-127" x2="-127" y2="127" stroke="#7A4D2E" stroke-width="6" opacity="0.4"/>
  </g>

  <!-- Macro Detail Tag -->
  <g transform="translate(40, 520)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#8F5D38"/>
    <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#554436" letter-spacing="1">WEAVE DETAIL (MACRO)</text>
  </g>
</svg>
