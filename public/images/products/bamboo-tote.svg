<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#462F1E" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="bambooWeave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C198"/>
      <stop offset="50%" stop-color="#CCA071"/>
      <stop offset="100%" stop-color="#9C7345"/>
    </linearGradient>
    <linearGradient id="leatherHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#804E2D"/>
      <stop offset="100%" stop-color="#4E2B15"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(150, 110)">
    <!-- Leather Handles -->
    <path d="M 70 160 C 70 20, 230 20, 230 160" fill="none" stroke="url(#leatherHandle)" stroke-width="12" stroke-linecap="round"/>
    <!-- Rivets -->
    <circle cx="70" cy="160" r="6" fill="#C49B74" stroke="#4E2B15" stroke-width="2"/>
    <circle cx="230" cy="160" r="6" fill="#C49B74" stroke="#4E2B15" stroke-width="2"/>

    <!-- Bag Body -->
    <rect x="20" y="140" width="260" height="230" rx="18" fill="url(#bambooWeave)"/>

    <!-- Woven Grid Pattern -->
    <g stroke="#80562D" stroke-width="2.5" opacity="0.45">
      <!-- Horizontal strips -->
      <line x1="20" y1="170" x2="280" y2="170"/>
      <line x1="20" y1="200" x2="280" y2="200"/>
      <line x1="20" y1="230" x2="280" y2="230"/>
      <line x1="20" y1="260" x2="280" y2="260"/>
      <line x1="20" y1="290" x2="280" y2="290"/>
      <line x1="20" y1="320" x2="280" y2="320"/>
      <line x1="20" y1="350" x2="280" y2="350"/>
      <!-- Vertical strips -->
      <line x1="50" y1="140" x2="50" y2="370"/>
      <line x1="80" y1="140" x2="80" y2="370"/>
      <line x1="110" y1="140" x2="110" y2="370"/>
      <line x1="140" y1="140" x2="140" y2="370"/>
      <line x1="170" y1="140" x2="170" y2="370"/>
      <line x1="200" y1="140" x2="200" y2="370"/>
      <line x1="230" y1="140" x2="230" y2="370"/>
      <line x1="260" y1="140" x2="260" y2="370"/>
    </g>

    <!-- Top Trim -->
    <rect x="15" y="132" width="270" height="18" rx="8" fill="#B38656"/>
  </g>

  <g transform="translate(40, 520)">
    <rect width="180" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#A07242"/>
    <text x="36" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#554436" letter-spacing="1">NATURAL BAMBOO</text>
  </g>
</svg>
